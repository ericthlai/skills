name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install reference validator
        run: python -m pip install skills-ref==0.1.1

      - name: Validate Agent Skills specification
        shell: bash
        run: |
          for skill in skills/*; do
            agentskills validate "$skill"
          done

      - name: Validate repository contracts
        run: python scripts/validate_repository.py
